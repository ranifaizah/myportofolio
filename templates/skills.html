{% extends 'base.html' %}
{% block content %}

<main>
    <section class="skills-section" id="skills">
        <div class="container">
            <p class="section-kicker">Hal-hal yang saya kuasai</p>
            <h1>Skills</h1>

            <div class="skills-grid">
                {% for skill in skill_list %}
                    <article class="skill-card">
                        <span class="skill-category">
                            {{ skill.get_category_display }}
                        </span>
                        <h2>{{ skill.name }}</h2>
                        <p class="skill-proficiency">
                            {{ skill.get_proficiency_display }}
                        </p>
                    </article>
                {% empty %}
                    <p class="empty-state">
                        Belum ada skill yang ditambahkan.
                    </p>
                {% endfor %}
            </div>
        </div>
    </section>
</main>
{% endblock content %}
