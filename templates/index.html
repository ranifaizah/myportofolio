{% extends 'base.html' %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1> <!---changes--->
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/ranran.jpe" alt="Photo of {{ name }}"> <!---changes--->
                </div>
                <div class="hero-details">
                    <!---changes--->
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd> <!---changes--->
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd> {{study_program}} </dd> <!---changes--->
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/ranifaizah" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/rani-faizah-a-/" class="social-link">LinkedIn</a>
                        <a href="mailto:rani.faizah@ui.ac.id" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>

    </main>
{% endblock content %}
